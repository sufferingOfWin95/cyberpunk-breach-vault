plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'breachvault'
version = '0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// JavaFX: плагин сам скачает нужные модули под нашу ОС
javafx {
    version = '21.0.5'
    modules = ['javafx.controls']
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'breachvault.app.BreachVaultApp'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// ---------- BreachVault.exe ----------
// jpackage (входит в JDK) собирает папку с .exe и своей урезанной Java внутри.
// Пользователю не нужна установленная Java. Результат: build/jpackage/out/BreachVault/
def jpackageDir = layout.buildDirectory.dir('jpackage')

tasks.register('packageApp', Exec) {
    group = 'distribution'
    description = 'Собирает BreachVault.exe со встроенной Java (jpackage, app-image)'
    dependsOn tasks.named('jar')

    def jpackageExe = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.map { it.metadata.installationPath.file('bin/jpackage.exe').asFile.absolutePath }

    doFirst {
        def dir = jpackageDir.get().asFile
        delete dir
        // input — только наш jar; JavaFX идёт отдельно, в module-path, и вшивается в саму Java
        copy { from tasks.named('jar'); into new File(dir, 'input') }
        copy {
            from configurations.runtimeClasspath.filter { it.name.startsWith('javafx') }
            into new File(dir, 'javafx')
        }
        commandLine jpackageExe.get(),
                '--type', 'app-image',
                '--name', 'BreachVault',
                '--app-version', '0.5',
                '--icon', file('src/main/packaging/breachvault.ico').absolutePath,
                '--input', new File(dir, 'input').absolutePath,
                '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--module-path', new File(dir, 'javafx').absolutePath,
                '--add-modules', 'javafx.controls',
                '--dest', new File(dir, 'out').absolutePath
    }
}
